version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.8-flash
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - DATA_DIR=/app/data
      - VECTOR_STORE_PATH=/app/data/faiss_index
      - CHUNK_SIZE=800
      - CHUNK_OVERLAP=150
      - TOP_K=5
      - SIMILARITY_THRESHOLD=0.35
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost
    volumes:
      - documind_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  documind_data:
